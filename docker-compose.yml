services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timba-web
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - path: .env
        required: false
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_prod}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - timba-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timba-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=http://web:5000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://futbol-predicciones.xyz}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
    networks:
      - timba-network

  updater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timba-updater
    restart: unless-stopped
    command: ["python", "background_updater.py", "--loop", "300"]
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
    networks:
      - timba-network

  live:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timba-live
    restart: unless-stopped
    command: ["python", "run_live.py"]
    env_file:
      - path: .env
        required: false
    environment:
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
    networks:
      - timba-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timba-bot
    restart: unless-stopped
    profiles:
      - bot
    command: ["python", "bot.py"]
    env_file:
      - path: .env
        required: false
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
    networks:
      - timba-network

networks:
  timba-network:
    driver: bridge
